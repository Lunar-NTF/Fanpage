# .github/workflows/fetch.yml
# Runs every 30 minutes automatically.
# Fetches tweet counts and saves snapshots to data/snapshots.json
# Then commits the updated file back to the repo.

name: Fetch counts

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit data back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch counts
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: npm run fetch

      - name: Commit updated snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          git diff --staged --quiet || git commit -m "chore: update snapshots [$(date -u +'%Y-%m-%d %H:%M')]"
          git push
