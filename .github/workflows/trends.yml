name: Scan trends

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note (e.g. event name)'
        required: false
        default: 'manual scan'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run trend scan
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: npm run trends

      - name: Commit trend results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/trends.json
          git diff --staged --quiet || git commit -m "chore: trend scan — ${{ github.event.inputs.note }} [$(date -u +'%Y-%m-%d %H:%M')]"
          git push

      - name: Trigger Pages redeploy
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true